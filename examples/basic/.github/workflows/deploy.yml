# Copy to .github/workflows/deploy.yml in your application repository.
# Fill in the three values from the kit's outputs.
name: deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    uses: Cover-Ops/terraform-aws-ecs-deploy/.github/workflows/deploy.yml@v0.1.0
    with:
      aws-region: ap-south-1
      push-role-arn: arn:aws:iam::123456789012:role/acme-production-ecs-push
      deploy-role-arn: arn:aws:iam::123456789012:role/acme-production-ecs-deploy
      ecr-repository-url: 123456789012.dkr.ecr.ap-south-1.amazonaws.com/acme-production
      ecs-cluster: acme-production
      ecs-service: api
      container-name: api
