# Copy to .github/workflows/rollback.yml. Actions -> rollback -> Run workflow,
# give the commit SHA (image tag) to go back to. Same approval as a deploy.
name: rollback

on:
  workflow_dispatch:
    inputs:
      image-tag:
        description: Image tag to go back to (a commit SHA that was deployed before)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  rollback:
    uses: Cover-Ops/terraform-aws-ecs-deploy/.github/workflows/deploy.yml@v0.2.0
    with:
      aws-region: ap-south-1
      push-role-arn: arn:aws:iam::123456789012:role/acme-production-ecs-push
      deploy-role-arn: arn:aws:iam::123456789012:role/acme-production-ecs-deploy
      ecr-repository-url: 123456789012.dkr.ecr.ap-south-1.amazonaws.com/acme-production
      ecs-cluster: acme-production
      ecs-service: api
      container-name: api
      image-tag: ${{ inputs.image-tag }}
